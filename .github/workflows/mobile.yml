name: Native mobile clients
on:
  push:
    paths: ['mobile/**', 'country-flags/**', '.github/workflows/mobile.yml', '.github/swift-problem-matcher.json']
  pull_request:
    paths: ['mobile/**', 'country-flags/**', '.github/workflows/mobile.yml', '.github/swift-problem-matcher.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" package requested by v3 is no longer available.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Kotlin client
        working-directory: mobile/android
        run: bash ./gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    # Use the standard Intel pool while macOS Arm64 runners have capacity delays.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Annotate Swift compiler diagnostics
        run: echo '::add-matcher::.github/swift-problem-matcher.json'
      - name: Test Swift protocol and canvas state
        run: swift test --package-path mobile/ios
      - name: Build native iPhone and iPad app
        run: >-
          xcodebuild -project mobile/ios/GuessTheDrawing.xcodeproj
          -scheme GuessTheDrawing -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath mobile/ios/build CODE_SIGNING_ALLOWED=NO build
