name: Native mobile clients
on:
  push:
    paths: ['mobile/**', 'country-flags/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'country-flags/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Kotlin client
        working-directory: mobile/android
        run: bash ./gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift protocol and canvas state
        run: swift test --package-path mobile/ios
      - name: Build native iPhone and iPad app
        run: >-
          xcodebuild -project mobile/ios/GuessTheDrawing.xcodeproj
          -scheme GuessTheDrawing -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath mobile/ios/build CODE_SIGNING_ALLOWED=NO build
